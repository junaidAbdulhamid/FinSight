[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finsight-api"
version = "0.1.0"
description = "Secure, auditable financial document RAG API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "email-validator>=2.1,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<1",
  "openai>=1.50,<2",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.5,<3",
  "pypdf>=5,<6",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

